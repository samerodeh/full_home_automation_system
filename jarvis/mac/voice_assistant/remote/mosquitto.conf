# mosquitto.conf -- the small MQTT broker that bridges the iOS app to Jarvis.
#
# This broker runs ON the Mac. Jarvis connects to it at 127.0.0.1; the phone
# reaches it over Tailscale (the Mac's 100.x.y.z address). It is SEPARATE from
# the home-automation broker at 192.168.2.38 that drives the ESP32 lights.
#
# --- Run it ---------------------------------------------------------------
#   brew install mosquitto
#   # create the user referenced by REMOTE_USERNAME/REMOTE_PASSWORD in .env:
#   mosquitto_passwd -c /opt/homebrew/etc/mosquitto/passwd jarvis
#   # then run with this config:
#   mosquitto -c /Users/samerodeh/projects/home_automation_system/jarvis/mac/voice/remote/mosquitto.conf
#   # or install it as a background service (edit the brew formula's conf, or):
#   brew services start mosquitto
# --------------------------------------------------------------------------

# Listen on all interfaces, port 1883. Access is gated two ways: a password
# (below) and Tailscale -- only devices on your tailnet can route to the Mac.
listener 1883

# Require a username/password. Must match REMOTE_USERNAME / REMOTE_PASSWORD in
# the Jarvis .env and the credentials entered in the iOS app's Settings.
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd

# Tighter option: instead of `listener 1883` above, bind only to localhost and
# your Mac's Tailscale IP so the broker is never exposed on your home LAN:
#   listener 1883 127.0.0.1
#   listener 1883 100.x.y.z        # <- your `tailscale ip -4`

# Chat messages are transient; no need to persist them across restarts.
persistence false

# Log to stdout (mosquitto's default); useful when running it in a terminal.
log_dest stdout
log_type warning
log_type notice
